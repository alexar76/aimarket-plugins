# Build a signed, logged tool-manifest revision (OWASP MCPSTG-SUPP-06).
# The release is run only on a runner with no repository write or OIDC permission.
name: Sign manifest revision

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version whose tools/list is signed, e.g. 2.1.3"
        required: true

permissions: {}

concurrency:
  group: manifest-revisions
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  SERVER: io.github.alexar76/aimarket-plugins
  MANIFEST_SOURCE: "pypi:aimarket-mcp-packager==${{ inputs.version }}"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: false
      - name: Package the signing CLI and its dependencies
        id: pack
        run: |
          uv pip install --python /usr/bin/python3 --target "$RUNNER_TEMP/revision-libs" \
            "aimarket-histor[sigstore]==0.8.0" "sigstore==4.5.1"
          tar -C "$RUNNER_TEMP/revision-libs" -czf "$RUNNER_TEMP/revision-cli.tar.gz" .
          printf 'sha256=%s\n' "$(sha256sum "$RUNNER_TEMP/revision-cli.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        id: upload
        with:
          path: ${{ runner.temp }}/revision-cli.tar.gz
          archive: false
          if-no-files-found: error

  capture:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check the version input
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.a-z0-9]*)$ ]]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/revision-cli
          skip-decompress: true
      - name: Unpack the prepared CLI
        env:
          CLI_SHA256: ${{ needs.prepare.outputs.sha256 }}
        run: |
          printf '%s  %s\n' "$CLI_SHA256" "$RUNNER_TEMP/revision-cli/revision-cli.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/revision-libs"
          tar -xzf "$RUNNER_TEMP/revision-cli/revision-cli.tar.gz" -C "$RUNNER_TEMP/revision-libs"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: false
      - name: Capture tools/list
        env:
          MCP_SOURCE: "uvx --from aimarket-mcp-packager==${{ inputs.version }} aimarket-mcp-packager-mcp"
        run: |
          PYTHONPATH="$RUNNER_TEMP/revision-libs" /usr/bin/python3 -s -P - <<'PY'
          import json
          import os
          from pathlib import Path

          from histor.toolcost_cli import tools_from_stdio

          tools = tools_from_stdio(os.environ["MCP_SOURCE"], 180)
          path = Path(os.environ["RUNNER_TEMP"]) / "tools.json"
          path.write_text(json.dumps(tools), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        id: upload
        with:
          path: ${{ runner.temp }}/tools.json
          archive: false
          if-no-files-found: error

  sign:
    needs: [prepare, capture]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/revision-cli
          skip-decompress: true
      - name: Unpack only the CLI produced by prepare
        env:
          CLI_SHA256: ${{ needs.prepare.outputs.sha256 }}
        run: |
          printf '%s  %s\n' "$CLI_SHA256" "$RUNNER_TEMP/revision-cli/revision-cli.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/revision-libs"
          tar -xzf "$RUNNER_TEMP/revision-cli/revision-cli.tar.gz" -C "$RUNNER_TEMP/revision-libs"
          printf 'PYTHONPATH=%s\n' "$RUNNER_TEMP/revision-libs" >> "$GITHUB_ENV"

      - name: Check the capture artifact ID
        env:
          CAPTURE_ID: ${{ needs.capture.outputs.artifact-id }}
        run: |
          [[ "$CAPTURE_ID" =~ ^[0-9]+$ ]]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          artifact-ids: ${{ needs.capture.outputs.artifact-id }}
          path: ${{ runner.temp }}/revision-capture
          skip-decompress: true

      - name: The manifest-revisions branch
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/manifest-revisions; then
            git fetch --depth 1 origin manifest-revisions:manifest-revisions
            git worktree add rev manifest-revisions
          else
            # ls-remote exits 2 for an absent ref. A transport error must stop signing.
            test "$?" -eq 2
            git worktree add --detach rev
            git -C rev switch --orphan manifest-revisions
          fi

      - name: Build the statement from the captured data and the current index
        id: build
        run: |
          tools="$RUNNER_TEMP/revision-capture/tools.json"
          test -f "$tools" && test ! -L "$tools"
          test "$(stat -c %s "$tools")" -le 8388608
          index=()
          [[ -f rev/index.json ]] && index=(--index rev/index.json)
          /usr/bin/python3 -s -P -m histor revision build --server "$SERVER" \
            --identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --server-version "$VERSION" --source "$MANIFEST_SOURCE" \
            --tools "$tools" "${index[@]}" --if-changed -o statement.json

      - name: Sign (Sigstore keyless; the entry goes to Rekor)
        if: steps.build.outputs.changed == 'true'
        run: /usr/bin/python3 -s -P -m sigstore sign --bundle statement.sigstore.json statement.json

      - name: Record and verify the signed revision against the captured data
        if: steps.build.outputs.changed == 'true'
        env:
          REVISION: ${{ steps.build.outputs.revision }}
        run: |
          set -o pipefail
          /usr/bin/python3 -s -P -m histor revision envelope statement.json statement.sigstore.json -o envelope.json
          /usr/bin/python3 -s -P -m histor revision record envelope.json --dir rev
          /usr/bin/python3 -s -P -m histor revision verify "rev/revisions/$REVISION.json" \
            --expected-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --tools "$RUNNER_TEMP/revision-capture/tools.json" | tee verify.json
          {
            echo "### $SERVER: revision $REVISION ($VERSION)"
            echo '~~~json'
            cat verify.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push the revision
        if: steps.build.outputs.changed == 'true'
        env:
          REVISION: ${{ steps.build.outputs.revision }}
        run: |
          log_index="$(/usr/bin/python3 -s -P -c 'import json,sys; print(json.load(open(sys.argv[1]))["transparencyLog"]["logIndex"])' "rev/revisions/$REVISION.json")"
          cd rev
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json revisions
          git commit -m "Revision $REVISION of $SERVER: $VERSION, Rekor log index $log_index"
          git push origin HEAD:manifest-revisions
