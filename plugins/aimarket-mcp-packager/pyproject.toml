[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aimarket-mcp-packager"
# The stdio server lives INSIDE the package, not as a top-level `mcp_stdio_server` module.
# Three distributions here shipped that same top-level name — aimarket-mcp, aimarket-oracle-gateway
# and (by entry point only) aimarket-mcp-packager — and all three are published, so installing any
# two into one environment made one silently overwrite the other's server. Measured 2026-07-31:
# with aimarket-mcp-packager and aimarket-oracle-gateway both installed, `mcp_stdio_server.py` in
# site-packages was the gateway's 15 897-byte file, so `aimarket-mcp-packager-mcp` launched the
# ORACLE GATEWAY. And packager alone was worse: its console script named a module its own wheel
# never contained, so a clean `pip install aimarket-mcp-packager` produced a script that died on
# `from mcp_stdio_server import main`.
#
# Console-script NAMES are unchanged, so every Claude Desktop / Glama config keeps working — only
# the module path behind them moved. A compatibility shim would have re-created the collision, so
# there is none: `import mcp_stdio_server` is gone deliberately.
# 2.1.1: the published 2.1.0 wheel carries a plugin.py whose class `version` still said
# 2.0.0, so the hub catalogue advertised 2.0.0 for an installed 2.1.0. Correcting the
# class attribute changes a shipped file, which is a new release, not a re-publish.
# 2.1.3: `uvx aimarket-mcp-packager` (what an MCP-registry client runs for a PyPI package) failed with
# "An executable named `aimarket-mcp-packager` is not provided": the only script was
# `aimarket-mcp-packager-mcp`. The package name is now a second name for the same server; the old
# name stays for existing Claude Desktop and Glama configs. Found by mcp-conformance (2026-09).
version = "2.2.0"
description = "Package products as ready-to-run MCP servers for Claude Desktop"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
# 2.2.0: the stdio server and the servers it generates moved to the 2.x `mcp` SDK (`MCPServer`,
# the handler-argument `Server`), the line that speaks MCP 2026-07-28 next to the handshake
# revisions. A generated server installs `aimarket-mcp>=0.7.0,<0.8`, the first release on that SDK.
dependencies = ["aimarket-hub>=3.0.0", "mcp>=2.3.0,<3"]

[project.optional-dependencies]
# Retain the documented extra for existing clients; the console script needs MCP
# on an ordinary installation too.
mcp = []
dev = ["pytest>=8", "jsonschema>=4.23"]

[project.scripts]
aimarket-mcp-packager = "aimarket_mcp_packager.stdio_server:main"
aimarket-mcp-packager-mcp = "aimarket_mcp_packager.stdio_server:main"

[project.entry-points."aimarket.plugins"]
mcp-packager = "aimarket_mcp_packager.plugin:MCPPlugin"

[tool.setuptools.packages.find]
include = ["aimarket_mcp_packager*"]
